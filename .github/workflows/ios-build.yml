name: iOS Build

on:
  push:
    branches: [master, main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:
    inputs:
      build_signed_ipa:
        description: "Also build signed IPA (requires Apple secrets)"
        type: boolean
        default: false

jobs:
  build-simulator:
    name: Build (iOS Simulator)
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Ensure iOS Simulator runtime
        run: |
          set -e
          xcodebuild -runFirstLaunch || true
          echo "Installed SDKs:"
          xcodebuild -showsdks || true

          # Placeholder "Any iOS Simulator Device" must NOT count as a real destination.
          real_sim_line() {
            xcodebuild -project WaRelay.xcodeproj -scheme WaRelay -showdestinations 2>&1 \
              | grep 'platform:iOS Simulator' \
              | grep 'name:iPhone' \
              | grep -E 'id:[0-9A-Fa-f-]{36}' \
              | grep -vi 'placeholder' \
              | grep -vi 'Any iOS Simulator' \
              | head -n 1 || true
          }

          LINE=$(real_sim_line)
          if [ -z "$LINE" ]; then
            echo "No real iPhone Simulator — downloading iOS platform (several minutes)…"
            xcodebuild -downloadPlatform iOS
            LINE=$(real_sim_line)
          fi

          if [ -z "$LINE" ]; then
            echo "::error::Still no real iPhone Simulator after platform download"
            xcodebuild -project WaRelay.xcodeproj -scheme WaRelay -showdestinations || true
            xcrun simctl list devices available || true
            exit 1
          fi
          echo "Real simulator available: $LINE"

      - name: Pick Simulator destination
        id: sim
        run: |
          set -e
          SHOW=$(xcodebuild -project WaRelay.xcodeproj -scheme WaRelay -showdestinations 2>&1 || true)
          echo "$SHOW"
          DEST=$(echo "$SHOW" \
            | grep 'platform:iOS Simulator' \
            | grep 'name:iPhone' \
            | grep -E 'id:[0-9A-Fa-f-]{36}' \
            | grep -vi 'placeholder' \
            | grep -vi 'Any iOS Simulator' \
            | head -n 1 || true)
          if [ -z "$DEST" ]; then
            echo "::error::No real iPhone Simulator destination (refusing placeholder)"
            exit 1
          fi
          UDID=$(echo "$DEST" | sed -n 's/.*id:\([0-9A-Fa-f-]\{36\}\).*/\1/p')
          NAME=$(echo "$DEST" | sed -n 's/.*name:\([^,}]*\).*/\1/p' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          OS=$(echo "$DEST" | sed -n 's/.*OS:\([^,}]*\).*/\1/p' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [ -n "$UDID" ]; then
            SPEC="platform=iOS Simulator,id=$UDID"
          elif [ -n "$NAME" ] && [ -n "$OS" ] && [ "$OS" != "latest" ]; then
            SPEC="platform=iOS Simulator,name=$NAME,OS=$OS"
          else
            echo "::error::Could not parse real simulator from: $DEST"
            exit 1
          fi
          echo "destination=$SPEC" >> "$GITHUB_OUTPUT"
          echo "Using destination: $SPEC ($NAME / $OS)"

      - name: Build for Simulator
        run: |
          set -o pipefail
          set +e
          xcodebuild \
            -project WaRelay.xcodeproj \
            -scheme WaRelay \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "${{ steps.sim.outputs.destination }}" \
            -derivedDataPath build/DerivedData \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "::group::Swift/compiler errors"
            grep -E 'error:|fatal error:|BUILD FAILED' build.log | tail -n 80 || true
            echo "::endgroup::"
            exit "$STATUS"
          fi

      - name: Package .app
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products -name "WaRelay.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "WaRelay.app not found"
            find build/DerivedData/Build/Products -maxdepth 4 -type d || true
            exit 1
          fi
          echo "Found app: $APP_PATH"
          mkdir -p dist
          ditto "$APP_PATH" dist/WaRelay.app
          (cd dist && zip -r WaRelay-simulator.zip WaRelay.app)

      - name: Upload simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaRelay-ios-simulator
          path: ios/dist/WaRelay-simulator.zip
          if-no-files-found: error
          retention-days: 14

  build-ipa:
    name: Archive IPA (signed)
    runs-on: macos-15
    needs: build-simulator
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_signed_ipa }}
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Require signing secrets
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          missing=0
          for v in IOS_CERTIFICATE_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISION_PROFILE_BASE64 IOS_TEAM_ID KEYCHAIN_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "Missing secret: $v"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Signed IPA needs repo secrets. See ios/README.md → Cloud build."
            exit 1
          fi

      - name: Import signing certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$IOS_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          echo -n "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$PP_PATH")")
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID.mobileprovision"
          echo "Installed profile $UUID"

      - name: Archive and export IPA
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -o pipefail
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>${IOS_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -project WaRelay.xcodeproj \
            -scheme WaRelay \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/WaRelay.xcarchive \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="com.warelay.app" \
            archive

          xcodebuild -exportArchive \
            -archivePath build/WaRelay.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WaRelay-ios-ipa
          path: ios/build/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14
