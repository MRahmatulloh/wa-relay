name: iOS Build

on:
  push:
    branches: [master, main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:
    inputs:
      build_signed_ipa:
        description: "Also build signed IPA (requires Apple secrets)"
        type: boolean
        default: false

jobs:
  build-simulator:
    name: Build (iOS Simulator)
    # macos-14 + Xcode 15.4 ships with iPhone Simulator runtimes.
    # macos-15 / Xcode 16.x often needs xcodebuild -downloadPlatform iOS which
    # flakes on GHA with "Unable to connect to simulator" (exit 70).
    runs-on: macos-14
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: Verify Simulator SDK
        run: |
          set -e
          xcodebuild -runFirstLaunch || true
          xcrun simctl list > /dev/null || true
          echo "Installed SDKs:"
          xcodebuild -showsdks
          if ! xcodebuild -showsdks 2>/dev/null | grep -q iphonesimulator; then
            echo "::error::iphonesimulator SDK missing on this runner/Xcode"
            exit 1
          fi
          echo "Available destinations:"
          xcodebuild -project WaRelay.xcodeproj -scheme WaRelay -showdestinations || true

      - name: Pick Simulator destination
        id: sim
        run: |
          set -e
          SHOW=$(xcodebuild -project WaRelay.xcodeproj -scheme WaRelay -showdestinations 2>&1 || true)
          DEST=$(echo "$SHOW" \
            | grep 'platform:iOS Simulator' \
            | grep 'name:iPhone' \
            | grep -E 'id:[0-9A-Fa-f-]{36}' \
            | grep -vi 'placeholder' \
            | grep -vi 'Any iOS Simulator' \
            | head -n 1 || true)
          if [ -n "$DEST" ]; then
            UDID=$(echo "$DEST" | sed -n 's/.*id:\([0-9A-Fa-f-]\{36\}\).*/\1/p')
            SPEC="platform=iOS Simulator,id=$UDID"
          else
            # Compile-only: no need to boot a named device when SDK is present.
            SPEC="generic/platform=iOS Simulator"
          fi
          echo "destination=$SPEC" >> "$GITHUB_OUTPUT"
          echo "Using destination: $SPEC"

      - name: Build for Simulator
        run: |
          set -o pipefail
          set +e
          xcodebuild \
            -project WaRelay.xcodeproj \
            -scheme WaRelay \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "${{ steps.sim.outputs.destination }}" \
            -derivedDataPath build/DerivedData \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "::group::Swift/compiler errors"
            grep -E 'error:|fatal error:|BUILD FAILED|Unable to find' build.log | tail -n 80 || true
            echo "::endgroup::"
            exit "$STATUS"
          fi

      - name: Package .app
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products -name "WaRelay.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "WaRelay.app not found"
            find build/DerivedData/Build/Products -maxdepth 4 -type d || true
            exit 1
          fi
          echo "Found app: $APP_PATH"
          mkdir -p dist
          ditto "$APP_PATH" dist/WaRelay.app
          (cd dist && zip -r WaRelay-simulator.zip WaRelay.app)

      - name: Upload simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaRelay-ios-simulator
          path: ios/dist/WaRelay-simulator.zip
          if-no-files-found: error
          retention-days: 14

  build-ipa:
    name: Archive IPA (signed)
    runs-on: macos-14
    needs: build-simulator
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_signed_ipa }}
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: Require signing secrets
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          missing=0
          for v in IOS_CERTIFICATE_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISION_PROFILE_BASE64 IOS_TEAM_ID KEYCHAIN_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "Missing secret: $v"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Signed IPA needs repo secrets. See ios/README.md → Cloud build."
            exit 1
          fi

      - name: Import signing certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$IOS_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          echo -n "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$PP_PATH")")
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID.mobileprovision"
          echo "Installed profile $UUID"

      - name: Archive and export IPA
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -o pipefail
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>${IOS_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -project WaRelay.xcodeproj \
            -scheme WaRelay \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/WaRelay.xcarchive \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="com.warelay.app" \
            archive

          xcodebuild -exportArchive \
            -archivePath build/WaRelay.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WaRelay-ios-ipa
          path: ios/build/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14
