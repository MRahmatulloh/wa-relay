services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - wa-relay
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping')\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Temporarily disabled — Flan-T5 job-extract (./ml)
  # job-extract:
  #   build: ./ml
  #   restart: unless-stopped
  #   ports:
  #     - "8282:8000"
  #   environment:
  #     MODEL_DIR: /app/model
  #   volumes:
  #     - ./ml/artifacts/model:/app/model:ro
  #   networks:
  #     - wa-relay

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "4500:3000"
    env_file:
      - .env
    environment:
      BAILEYS_AUTH_DIR: /app/baileys_auth
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      GEMINI_TIMEOUT_MS: ${GEMINI_TIMEOUT_MS:-8000}
      # Empty while job-extract is off (Gemini → rules_v1 only)
      OWN_MODEL_URL: ${OWN_MODEL_URL:-}
      OWN_MODEL_TIMEOUT_MS: ${OWN_MODEL_TIMEOUT_MS:-2500}
    volumes:
      - baileys_auth:/app/baileys_auth
      - ./backend/config:/app/config:ro
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - wa-relay

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "8182:80"
    depends_on:
      - backend
    networks:
      - wa-relay

volumes:
  mongo_data:
  baileys_auth:

networks:
  wa-relay:
