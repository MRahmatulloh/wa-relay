services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - wa-relay
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping')\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "4500:3000"
    env_file:
      - .env
    environment:
      BAILEYS_AUTH_DIR: /app/baileys_auth
    volumes:
      - baileys_auth:/app/baileys_auth
      - ./backend/config:/app/config:ro
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - wa-relay

volumes:
  mongo_data:
  baileys_auth:

networks:
  wa-relay:
