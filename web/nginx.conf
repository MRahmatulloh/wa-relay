server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Always revalidate the app shell so clients pick up new hashed assets.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files /index.html =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /auth/ {
    proxy_pass http://backend:3000/auth/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /devices/ {
    proxy_pass http://backend:3000/devices/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /devices {
    proxy_pass http://backend:3000/devices;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /messages/ {
    proxy_pass http://backend:3000/messages/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /messages {
    proxy_pass http://backend:3000/messages;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /health {
    proxy_pass http://backend:3000/health;
  }

  location /qr {
    proxy_pass http://backend:3000/qr;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /test/ {
    proxy_pass http://backend:3000/test/;
    proxy_set_header Host $host;
  }

  location /socket.io/ {
    proxy_pass http://backend:3000/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }
}
